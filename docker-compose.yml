services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lending
      POSTGRES_PASSWORD: lending
      POSTGRES_DB: lending
    ports:
      - "5433:5432" # 5433 on the host, so it does not clash with a local PostgreSQL on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lending -d lending"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
